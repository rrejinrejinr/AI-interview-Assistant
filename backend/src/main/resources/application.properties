# Spring Boot Application Properties
server.port=${PORT:8080}

# ML Microservice configuration
ml.service.url=${ML_SERVICE_URL:http://localhost:8001}

# Database configuration (supports environment variables with H2 fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:interviewdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# CORS Allowed Origins
app.cors.allowed-origins=${ALLOWED_ORIGINS:*}

# H2 Console configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Multipart limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
